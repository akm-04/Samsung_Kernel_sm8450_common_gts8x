name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      root_solution:
        description: 'Choose Root Method'
        required: true
        type: choice
        default: 'KernelSU-Next'
        options:
          - KernelSU-Next
          - None

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CI_RUN: "1"
      CI_TOOLCHAIN_DIR: ${{ github.workspace }}/Clang
      
      CI_ENABLE_KSU_NEXT: ${{ inputs.root_solution == 'KernelSU-Next' && '1' || '0' }}
      # kprobes disabled, so must default to manual hooks
      CI_KSU_NEXT_MANUAL_HOOKS: "1"
      
    steps:
      - name: Compute Build Variables & Dynamic Names
        run: |
          SHORT_BRANCH=$(echo "${{ github.ref_name }}" | cut -d'_' -f1,2)
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          
          ROOT="${{ inputs.root_solution }}"
          
          if [ "$ROOT" == "None" ]; then
            ROOT_SUFFIX=""
            DISPLAY_NAME="Vanilla"
          elif [ "$ROOT" == "KernelSU-Next" ]; then
            ROOT_SUFFIX="-KernelSU-Next"
            DISPLAY_NAME="KernelSU-Next"
          fi
          
          ARTIFACT_NAME="${SHORT_BRANCH}${ROOT_SUFFIX}-flashable-${TIMESTAMP}"
          
          echo "SHORT_BRANCH=$SHORT_BRANCH" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "DISPLAY_NAME=$DISPLAY_NAME" >> "$GITHUB_ENV"

      - name: Check starting disk space
        run: df -h /

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Create LTO swapfile
        run: |
          sudo fallocate -l 48G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h /

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            dwarves fakeroot \
            git curl wget rsync patch \
            python3 python3-pip \
            zip unzip cpio kmod \
            perl pkg-config \
            device-tree-compiler u-boot-tools \
            liblz4-tool zstd \
            clang llvm lld lldb \
            binutils-aarch64-linux-gnu \
            libc6-dev-i386 lib32stdc++6 lib32z1

      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.CI_TOOLCHAIN_DIR }}
          key: toolchain-r416183c1

      - name: Run build
        env:
          CI_KERNEL_NAME: "${{ env.SHORT_BRANCH }}_workflow_kernel-build"
        run: ./build.sh

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            AnyKernel3/*
            !AnyKernel3/*.zip

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Generate Public Download Link
        if: success()
        run: |
          echo "### Download Link (No Login Required)" >> $GITHUB_STEP_SUMMARY
          echo "**Build Variant:** ${{ env.DISPLAY_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "This link downloads this exact build." >> $GITHUB_STEP_SUMMARY
          echo "[Download ${{ env.DISPLAY_NAME }} Kernel](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/${{ env.ARTIFACT_NAME }}.zip)" >> $GITHUB_STEP_SUMMARY
